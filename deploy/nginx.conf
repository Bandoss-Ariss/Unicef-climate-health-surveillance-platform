# /etc/nginx/sites-available/unicef-climat-sante
# Frontend statique (dist/) + proxy vers l'API FastAPI (uvicorn :63000)
server {
    listen 80;
    server_name unicef-climat-sante.goaicorporation.org 77.37.124.86;

    root /var/www/unicef-climat-sante/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Application React (routage côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets avec empreinte : cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API FastAPI
    location ~ ^/(api|health|docs|openapi\.json|redoc) {
        proxy_pass         http://127.0.0.1:63000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
